<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>parkPD</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: #ececef;
        /* Stops iOS Safari inflating text in landscape. */
        -webkit-text-size-adjust: 100%;
      }

      /* Keeps the app phone-shaped on desktop instead of stretching a 22px
         input across a 2000px monitor. */
      #root {
        display: flex;
        flex-direction: column;
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
      }

      @media (min-width: 481px) {
        #root {
          box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
